<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Aryan Jivani — Software Engineer</title>
  <desc id="description">
    Animated dark-tech profile banner with cyan and purple accents.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="52%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <radialGradient id="cyan-glow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path
        d="M 36 0 L 0 0 0 36"
        fill="none"
        stroke="#94a3b8"
        stroke-opacity="0.055"
        stroke-width="1"
      />
    </pattern>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="316" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#grid)" />

    <circle cx="160" cy="70" r="250" fill="url(#cyan-glow)">
      <animate
        attributeName="opacity"
        values="0.55;1;0.55"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="1080" cy="290" r="300" fill="url(#purple-glow)">
      <animate
        attributeName="opacity"
        values="1;0.5;1"
        dur="6s"
        repeatCount="indefinite"
      />
    </circle>

    <g opacity="0.8">
      <circle cx="34" cy="30" r="5" fill="#fb7185" />
      <circle cx="52" cy="30" r="5" fill="#fbbf24" />
      <circle cx="70" cy="30" r="5" fill="#34d399" />
      <text
        x="94"
        y="35"
        fill="#64748b"
        font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="13"
      >
        aryan@github: ~/profile
      </text>
    </g>

    <g
      fill="none"
      stroke="url(#accent)"
      stroke-linecap="round"
      filter="url(#soft-glow)"
    >
      <path
        d="M 365 93 C 470 58, 730 58, 835 93"
        stroke-width="2"
        stroke-dasharray="12 16"
        opacity="0.5"
      >
        <animate
          attributeName="stroke-dashoffset"
          from="0"
          to="-56"
          dur="3s"
          repeatCount="indefinite"
        />
      </path>

      <path
        d="M 410 246 C 500 274, 700 274, 790 246"
        stroke-width="2"
        stroke-dasharray="8 14"
        opacity="0.35"
      >
        <animate
          attributeName="stroke-dashoffset"
          from="0"
          to="44"
          dur="3.5s"
          repeatCount="indefinite"
        />
      </path>
    </g>

    <text
      x="600"
      y="144"
      fill="#f8fafc"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="58"
      font-weight="800"
      letter-spacing="-2"
      text-anchor="middle"
    >
      ARYAN JIVANI
    </text>

    <text
      x="600"
      y="192"
      fill="#94a3b8"
      font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
      font-size="21"
      letter-spacing="4"
      text-anchor="middle"
    >
      SOFTWARE ENGINEER
    </text>

    <rect
      x="447"
      y="216"
      width="306"
      height="2"
      rx="1"
      fill="url(#accent)"
      filter="url(#soft-glow)"
    >
      <animate
        attributeName="width"
        values="80;306;80"
        dur="4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="x"
        values="560;447;560"
        dur="4s"
        repeatCount="indefinite"
      />
    </rect>

    <text
      x="600"
      y="278"
      fill="#67e8f9"
      font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
      font-size="15"
      text-anchor="middle"
    >
      scala • spark • react • reliable systems
    </text>

    <rect
      x="-220"
      y="0"
      width="140"
      height="320"
      fill="#ffffff"
      opacity="0.025"
      transform="skewX(-20)"
    >
      <animate
        attributeName="x"
        from="-220"
        to="1420"
        dur="7s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <rect
    x="2"
    y="2"
    width="1196"
    height="316"
    rx="28"
    fill="none"
    stroke="url(#accent)"
    stroke-opacity="0.4"
    stroke-width="2"
  />
</svg>
